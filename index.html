        let ws;
        function connectWS() {
          try {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);
                if (data.type === 'STATUS') {
                  setEsp32Status({ connected: data.connected, port: data.port });
                } else if (data.type === 'RFID_SCAN') {
                  handleHardwareScan(data.patientId, data.uid);
                }
              } catch (e) {}
            };

            ws.onclose = () => {
              setEsp32Status({ connected: false, port: null });
              setTimeout(connectWS, 3000);
            };
          } catch (e) {}
        }

            setPinInput("");
            setLookupError("");
            setConsentError("");

            logAccess(
              "RFID_CARD_SCANNED",
              `RC522 RFID Card [UID: ${cardUID}] scanned for patient ${targetRecord.id} (${targetRecord.name}). Proceeding to Consent Verification Gate.`
            );
            showToast(`💳 RFID Card Detected: Enter Consent PIN for ${targetRecord.name}`, "success");
            setView("consent");
          }
        }
      };

      // Confirm Emergency RFID Bypass (EMT & Doctors only)
      const confirmEmergencyRfidBypass = (reason = "Acute trauma resuscitation / Unconscious patient") => {
        if (!pendingRfidBypass) return;

        const { targetId, cardUID, targetRecord } = pendingRfidBypass;
        setSelectedPatientId(targetId);
        setIsPinVerified(true);
        setLookupError("");
        setConsentError("");

        logAccess(
          "EMERGENCY_RFID_OTP_BYPASS",
          `🚨 CRITICAL CLINICAL BYPASS: ${user?.role} ${user?.name} bypassed patient consent OTP using physical RFID Card [UID: ${cardUID}] for ${targetId} (${targetRecord.name}). Justification: ${reason}. Full EMR released.`
        );

        showToast(`⚠️ Emergency RFID Bypass Authorized: Accessing ${targetRecord.name} EMR (Audit Logged)`, "warning");
        setPendingRfidBypass(null);
        setView("patient-record");
      };

      // Handle Standard Login (Standard authentication required for staff)
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const username = e.target.username.value.trim();
        const password = e.target.password.value.trim();

        if (!selectedRole) {
          setLoginError("Please select a professional role.");
          return;
        }

        const validUser = MOCK_DATA.auth.users.find(
          u => u.username.toLowerCase() === username.toLowerCase() && u.password === password
        );

        if (validUser) {
          const authUser = {
            username: validUser.username,
            name: validUser.name,
            role: selectedRole
          };
          setUser(authUser);
          setLoginError("");
          logAccess("STAFF_LOGIN", `Standard password login as ${selectedRole}`, authUser);
          setView("dashboard");
          setSidebarTab("overview");
        } else {
          setLoginError("Invalid username or password. (Demo: doctor_smith / 123, admin / 123)");
        }
      };

      // Patient Lookup Submit -> Advances to Mandatory Consent Verification Gate
      const handleLookupSubmit = (e) => {
        if (e) e.preventDefault();
        const cleanedId = patientIdInput.trim().toUpperCase();

        if (!cleanedId) {
          setLookupError("Please enter or scan a valid Patient Identifier.");
          return;
        }

        let targetRecord = patientRecords[cleanedId];
        if (!targetRecord && cleanedId === "P001") {
          targetRecord = patientRecords["PAT-2026-001"];
        }

        if (targetRecord) {
          setLookupError("");
          setSelectedPatientId(targetRecord.id);
          setIsPinVerified(false);
          setPinInput("");
          setConsentError("");

          logAccess(
            "PATIENT_ID_LOOKUP",
            `Patient ID lookup verified [${targetRecord.id} - ${targetRecord.name}]. Consent PIN verification required.`
          );
          setView("consent");
        } else {
          setLookupError(`No matching medical record found for Patient ID "${cleanedId}".`);
          logAccess("PATIENT_LOOKUP_NOT_FOUND", `Failed lookup attempt for ID "${cleanedId}"`);
        }
      };

      // Mandatory Patient Consent PIN Verification (No bypass)
      const handleConsentSubmit = (e) => {
        if (e) e.preventDefault();
        if (pinInput.trim() === MOCK_DATA.consentPin) {
          setConsentError("");
          setIsPinVerified(true);
          logAccess(
            "PATIENT_CONSENT_VERIFIED",
            `Patient consent 4-digit PIN verified successfully for ${selectedPatientId} by ${user?.name || 'Staff'}. EMR record opened.`
          );
          setView("patient-record");
        } else {
          setConsentError("Incorrect PIN, try again.");
          logAccess("PATIENT_CONSENT_FAILED", `Incorrect PIN entered for ${selectedPatientId} by ${user?.name || 'Staff'}`);
          setPinInput("");
        }
      };

      // ADMIN: Delete Patient Record
      const handleDeletePatient = (patientId) => {
        if (user?.role !== "Admin") {
          alert("Unauthorized: Only Administrators can delete patient records.");
          return;
        }

        const patientToDelete = patientRecords[patientId];
        if (!patientToDelete) return;

        const confirmDelete = window.confirm(
          `Are you sure you want to permanently delete record ${patientId} (${patientToDelete.name})?\nThis action will be logged in the permanent audit trail.`
        );

        if (confirmDelete) {
          setPatientRecords(prev => {
            const updated = { ...prev };
            delete updated[patientId];
            return updated;
          });

          logAccess(
            "PATIENT_RECORD_DELETED",
            `Administrator ${user.name} permanently deleted medical record for ${patientId} (${patientToDelete.name})`
          );
          showToast(`Record ${patientId} successfully deleted.`, "success");

          if (selectedPatientId === patientId) {
            setView("dashboard");
            setSelectedPatientId(null);
          }
        }
      };

      // ADMIN: Save Altered Patient Record
      const handleSaveEditedPatient = (updatedRecord) => {
        if (user?.role !== "Admin") {
          alert("Unauthorized: Only Administrators can alter patient records.");
          return;
        }

        setPatientRecords(prev => ({
          ...prev,
          [updatedRecord.id]: updatedRecord
        }));

        logAccess(
          "PATIENT_RECORD_ALTERED",
          `Administrator ${user.name} modified clinical details for ${updatedRecord.id} (${updatedRecord.name})`
        );

        setEditingPatient(null);
        showToast(`Record ${updatedRecord.id} successfully updated.`, "success");
      };

      // Add New Document to Patient Record (via Browse or Drag-and-Drop)
      const handleAddDocument = (patientId, newDoc) => {
        setPatientRecords(prev => {
          const patient = prev[patientId] || prev["PAT-2026-001"];
          if (!patient) return prev;
          
          const currentDocs = patient.uploadedDocuments || [];
          const updated = {
            ...patient,
            uploadedDocuments: [newDoc, ...currentDocs]
          };
          return {
            ...prev,
            [patientId]: updated
          };
        });

        logAccess(
          "PATIENT_DOC_ADDED",
          `${user?.role || 'Staff'} ${user?.name || 'Staff'} uploaded document [${newDoc.documentId} - ${newDoc.title}] for patient ${patientId}`
        );
        showToast(`Document "${newDoc.title}" successfully added.`, "success");
      };

      // Remove Document from Patient Record
      const handleRemoveDocument = (patientId, docId) => {
        const patient = patientRecords[patientId] || patientRecords["PAT-2026-001"];
        if (!patient) return;

        const confirmRemove = window.confirm(
          `Are you sure you want to remove document ${docId} from patient record ${patientId}?`
        );
        if (!confirmRemove) return;

        setPatientRecords(prev => {
          const pat = prev[patientId] || prev["PAT-2026-001"];
          if (!pat) return prev;

          // Check if it's in uploadedDocuments
          const currentUploaded = pat.uploadedDocuments || [];
          const updatedUploaded = currentUploaded.filter(d => d.documentId !== docId);

          let updatedPat = { ...pat, uploadedDocuments: updatedUploaded };

          // If it was preRecord or postRecord, allow clearing if deleted
          if (pat.preRecord && pat.preRecord.documentId === docId) {
            updatedPat.preRecord = null;
          }
          if (pat.postRecord && pat.postRecord.documentId === docId) {
            updatedPat.postRecord = null;
          }

          return {
            ...prev,
            [patientId]: updatedPat
          };
        });

        logAccess(
          "PATIENT_DOC_REMOVED",
          `${user?.role || 'Staff'} ${user?.name || 'Staff'} removed document [${docId}] from patient ${patientId}`
        );
        showToast(`Document ${docId} removed from patient record.`, "info");
      };

      const handleLogout = () => {
        if (user) {
          logAccess("STAFF_LOGOUT", `User ${user.name} logged out`);
        }
        setUser(null);
        setView("main");
        setSelectedPatientId(null);
        setIsPinVerified(false);
        setPinInput("");
        setPatientIdInput("");
        setLoginError("");
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50 text-slate-900">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-18 right-6 z-50 px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center space-x-2 screen-fade ${
              notification.type === 'warning' 
                ? 'bg-amber-50 border-amber-300 text-amber-900' 
                : 'bg-emerald-50 border-emerald-300 text-emerald-900'
            }`}>
              <span>{notification.type === 'warning' ? '⚠️' : '✅'}</span>
              <span>{notification.message}</span>
            </div>
          )}

          {/* Top Clinical Header */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => user ? setView("dashboard") : setView("main")}>
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 font-bold text-lg">
                  +
                </div>
                <div>
                  <span className="font-bold text-lg tracking-tight flex items-center gap-2">
                    PulseCare <span className="text-[11px] font-semibold tracking-wider px-2 py-0.5 bg-blue-950 text-blue-300 rounded border border-blue-800">HMS + EMR</span>
                  </span>
                  <p className="text-xs text-slate-400 hidden sm:block">Hospital Information & Clinical Records Portal</p>
                </div>
              </div>

              {/* Header Right: ESP32 Status Pill & User Profile */}
              <div className="flex items-center space-x-3">
                {/* Live ESP32 RFID Status Indicator */}
                <div className={`flex items-center space-x-2 text-xs px-2.5 py-1.5 rounded-lg border transition-all ${
                  esp32Status.connected 
                    ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' 
                    : 'bg-slate-800 text-slate-400 border-slate-700'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${esp32Status.connected ? 'bg-emerald-400 badge-pulse' : 'bg-slate-500'}`}></span>
                  <span className="font-mono font-medium">
                    {esp32Status.connected ? `RC522 RFID: Ready (${esp32Status.port || 'USB'})` : 'RFID Reader: Disconnected'}
                  </span>
                </div>

                {user && (
                  <div className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-xs ${
                    user.isEmergencyAccess 
                      ? 'bg-rose-950 text-rose-200 border-rose-800' 
                      : 'bg-slate-800 text-slate-200 border-slate-700'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${user.isEmergencyAccess ? 'bg-rose-500 badge-pulse' : 'bg-blue-400'}`}></span>
                    <span className="font-medium">{user.name}</span>
                    <span className={`text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${
                      user.isEmergencyAccess ? 'bg-rose-900 text-rose-100' : 'bg-blue-900 text-blue-200'
                    }`}>
                      {user.role} {user.isEmergencyAccess && '🚨 BYPASS'}
                    </span>
                    <button 
                      onClick={handleLogout}
                      className="ml-2 text-rose-400 hover:text-rose-300 hover:underline border-l border-slate-700 pl-2">
                      Sign out
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Dynamic Content Views */}
          <main className="flex-1 flex flex-col">
            {view === "main" && (
              <MainLandingPage 
                onEnterLogin={(role) => {
                  setSelectedRole(role);
                  setView("login");
                }} 
              />
            )}

            {view === "login" && (
              <UnifiedLoginScreen 
                selectedRole={selectedRole}
                setSelectedRole={setSelectedRole}
                loginError={loginError}
                onSubmit={handleLoginSubmit}
                onBack={() => setView("main")}
              />
            )}

            {view === "dashboard" && (
              <HospitalDashboardLayout 
                user={user}
                sidebarTab={sidebarTab}
                setSidebarTab={setSidebarTab}
                patientRecords={patientRecords}
                rooms={rooms}
                setRooms={setRooms}
                departments={departments}
                setDepartments={setDepartments}
                staffUsers={staffUsers}
                setStaffUsers={setStaffUsers}
                onNavigateRecords={() => setView("patient-lookup")}
                onDeletePatient={handleDeletePatient}
                onEditPatient={(p) => setEditingPatient(p)}
                onOpenAddRoom={() => setShowAddRoomModal(true)}
                onOpenAddDoctor={() => setShowAddDoctorModal(true)}
                auditLogs={auditLogs}
                esp32Status={esp32Status}
              />
            )}

            {view === "patient-lookup" && (
              <PatientLookupScreen 
                patientIdInput={patientIdInput}
                setPatientIdInput={setPatientIdInput}
                lookupError={lookupError}
                onSubmit={handleLookupSubmit}
                onBack={() => setView("dashboard")}
                esp32Status={esp32Status}
                isScanningAnimation={isScanningAnimation}
                lastCardScan={lastCardScan}
                onSimulateScan={() => {
                  setPatientIdInput("PAT-2026-001");
                  const targetRecord = patientRecords["PAT-2026-001"];
                  const userRole = user?.role;
                  if (userRole === "EMT" || userRole === "Doctor") {
                    setPendingRfidBypass({ targetId: "PAT-2026-001", cardUID: "SIM-RFID-99", targetRecord });
                  } else {
                    setSelectedPatientId("PAT-2026-001");
                    setIsPinVerified(false);
                    setPinInput("");
                    logAccess("SIMULATED_CARD_SCAN", "Simulated RFID card tap for PAT-2026-001. Advanced to PIN verification gate.");
                    setView("consent");
                  }
                }}
              />
            )}

            {view === "consent" && (
              <ConsentVerificationScreen 
                patientId={selectedPatientId}
                pinInput={pinInput}
                setPinInput={setPinInput}
                consentError={consentError}
                onSubmit={handleConsentSubmit}
                user={user}
                onBack={() => setView("patient-lookup")}
              />
            )}

            {view === "patient-record" && (
              <PatientEMRDashboard 
                patientId={selectedPatientId}
                record={patientRecords[selectedPatientId] || INITIAL_PATIENT_RECORDS["PAT-2026-001"]}
                user={user}
                onEditPatient={(rec) => setEditingPatient(rec)}
                onDeletePatient={handleDeletePatient}
                onAddDocument={handleAddDocument}
                onRemoveDocument={handleRemoveDocument}
                onBackToLookup={() => {
                  setIsPinVerified(false);
                  setPinInput("");
                  setView("patient-lookup");
                }}
                onBackToDashboard={() => {
                  setIsPinVerified(false);
                  setPinInput("");
                  setView("dashboard");
                }}
              />
            )}
          </main>

          {/* ADMIN: Edit Patient Modal */}
          {editingPatient && (
            <AdminEditPatientModal 
              patient={editingPatient}
              onClose={() => setEditingPatient(null)}
              onSave={handleSaveEditedPatient}
            />
          )}

          {/* ADMIN & RECEPTIONIST: Add Room & Bed Modal */}
          {showAddRoomModal && (
            <AddRoomBedModal
              onClose={() => setShowAddRoomModal(false)}
              onAddRoom={(newRoom) => {
                setRooms(prev => [...prev, newRoom]);
                logAccess(
                  "ROOM_BED_ADDED",
                  `${user?.role} ${user?.name} added new bed allocation: ${newRoom.room} (${newRoom.ward} - ${newRoom.bed})`
                );
                showToast(`New Room/Bed ${newRoom.room} added successfully!`, "success");
                setShowAddRoomModal(false);
              }}
            />
          )}

          {/* ADMIN ONLY: Add Doctor & Assign Department Modal */}
          {showAddDoctorModal && user?.role === "Admin" && (
            <AddDoctorModal
              departments={departments}
              onClose={() => setShowAddDoctorModal(false)}
              onAddDoctor={(newDoc) => {
                setStaffUsers(prev => [...prev, newDoc]);
                // Increment doctor count in the assigned department
                setDepartments(prev => prev.map(d => {
                  if (d.name === newDoc.dept) {
                    return { ...d, doctors: (d.doctors || 0) + 1 };
                  }
                  return d;
                }));
                logAccess(
                  "DOCTOR_STAFF_ADDED",
                  `Administrator ${user?.name} added and assigned ${newDoc.name} to ${newDoc.dept}`
                );
                showToast(`Dr. ${newDoc.name} assigned to ${newDoc.dept}!`, "success");
                setShowAddDoctorModal(false);
              }}
            />
          )}

          {/* EMERGENCY RFID DIRECT BYPASS WARNING MODAL (EMT & DOCTORS) */}
          {pendingRfidBypass && (
            <EmergencyRfidWarningModal
              bypassData={pendingRfidBypass}
              user={user}
              onConfirm={confirmEmergencyRfidBypass}
              onFallbackToPin={() => {
                const target = pendingRfidBypass.targetRecord;
                setSelectedPatientId(target.id);
                setIsPinVerified(false);
                setPinInput("");
                setPendingRfidBypass(null);
                setView("consent");
              }}
              onCancel={() => setPendingRfidBypass(null)}
            />
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500">
            <p>PulseCare Hospital Information System &bull; Electronic Medical Records &bull; Audit Trail & Compliance Enabled</p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 1. MAIN LANDING PAGE
    // ==========================================

      const roles = [
        { role: "Doctor", desc: "Medical and clinical staff with full diagnostic EMR access", icon: "👨‍⚕️" },

            +
          </div>
          <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
            PulseCare Hospital Management System

              </div>
            ))}

      );
    }

    // ==========================================
    // 2. UNIFIED LOGIN SCREEN
    // ==========================================
    function UnifiedLoginScreen({ selectedRole, setSelectedRole, loginError, onSubmit, onBack }) {
      const roleList = ["Doctor", "Receptionist", "EMT", "Admin"];

      // Filter demo credentials matching the currently selected role
      const roleUsers = MOCK_DATA.auth.users.filter(u => u.role === selectedRole);
      const defaultUser = roleUsers[0] || { username: "doctor_smith", password: "123" };

      const fillCredentials = (username, password) => {
        const uInput = document.getElementById('username');
        const pInput = document.getElementById('password');
        if (uInput) uInput.value = username;
        if (pInput) pInput.value = password;
      };

      return (
        <div className="flex-1 flex items-center justify-center p-4 screen-fade">
          <div className="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 border border-slate-200">
            <button 
              onClick={onBack}
              className="text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-4">
              &larr; Back to main portal
            </button>

            <div className="text-center mb-6">
              <div className="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 mx-auto flex items-center justify-center font-bold text-xl mb-2">
                🔒
              </div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Staff Authentication</h2>
              <p className="text-xs text-slate-500 mt-1">Single sign-on access to hospital dashboard for all departments</p>
            </div>

            {/* Role Selector Tabs */}
            <div className="mb-5">
              <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                Select Your Professional Role
              </label>
              <div className="grid grid-cols-4 gap-1 p-1 bg-slate-100 rounded-xl border border-slate-200">
                {roleList.map((r) => (
                  <button
                    key={r}
                    type="button"
                    onClick={() => {
                      setSelectedRole(r);
                      const matched = MOCK_DATA.auth.users.find(u => u.role === r);
                      if (matched) fillCredentials(matched.username, matched.password);
                    }}
                    className={`py-2 text-xs font-semibold rounded-lg transition-all ${
                      selectedRole === r 
                        ? 'bg-white text-blue-700 shadow-sm' 
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    {r}
                  </button>
                ))}
              </div>
            </div>

            {/* Role-Specific Quick Logins Selector */}
            <div className="mb-5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs text-slate-600">
              <div className="flex items-center justify-between">
                <span className="font-semibold text-slate-900">Available Mock Logins ({selectedRole}):</span>
                <span className="text-[10px] text-slate-400 font-mono">Password for all: 123</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                {roleUsers.map((u) => (
                  <button
                    key={u.username}
                    type="button"
                    onClick={() => fillCredentials(u.username, u.password)}
                    className="p-2 bg-white hover:bg-blue-50 border border-slate-200 rounded-lg text-left transition-all group shadow-2xs"
                  >
                    <div className="font-bold text-slate-800 group-hover:text-blue-700 truncate">{u.name}</div>
                    <div className="text-[10px] text-slate-500 font-mono flex items-center justify-between mt-0.5">
                      <span>{u.username}</span>
                      <span className="text-blue-600 group-hover:underline">Use &rarr;</span>
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {loginError && (
              <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                {loginError}
              </div>
            )}

            <form onSubmit={onSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                  Staff Username
                </label>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  required 
                  defaultValue={defaultUser.username}
                  placeholder="Enter staff username"
                  className="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                  Security Password
                </label>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  required 
                  defaultValue={defaultUser.password}
                  placeholder="Enter password"
                  className="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2 mt-2"
              >

    // 3. HOSPITAL DASHBOARD LAYOUT & MODULES (Role-Based Access Control)

      rooms,
      setRooms,
      departments,
      setDepartments,
      staffUsers,
      setStaffUsers,
      onNavigateRecords,

        { id: "patients", label: "Patients", icon: "👥", roles: ["Admin", "Doctor", "Receptionist"] },

        { id: "departments", label: "Departments", icon: "🏢", roles: ["Admin", "Doctor", "Receptionist", "EMT"] },
        { id: "appointments", label: "Appointments", icon: "📅", roles: ["Admin", "Doctor", "Receptionist"] },
        { id: "emergency", label: "Emergency Intake", icon: "🚨", roles: ["Admin", "EMT", "Doctor"] },
        { id: "staff", label: "Staff Directory", icon: "🥼", roles: ["Admin", "Doctor"] },

        const canAccessCurrentTab = sidebarItems.some(item => item.id === sidebarTab);
        if (!canAccessCurrentTab) {
          setSidebarTab("overview");

      return (
        <div className="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6 screen-fade">
          {/* Sidebar */}
          <aside className="w-64 flex-shrink-0 hidden md:block">
            <div className="glass-card rounded-2xl p-4 sticky top-24 border border-slate-200">
              <div className="pb-3 mb-3 border-b border-slate-100 flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Navigation</span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                  userRole === 'Admin' ? 'bg-purple-100 text-purple-800' :
                  userRole === 'Doctor' ? 'bg-blue-100 text-blue-800' :
                  userRole === 'EMT' ? 'bg-rose-100 text-rose-800' : 'bg-teal-100 text-teal-800'

                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      sidebarTab === item.id 
                        ? 'bg-blue-600 text-white shadow-sm' 
                        : item.highlight 
                          ? 'bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold border border-blue-200' 
                          : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                    }`}
                  >
                    <div className="flex items-center space-x-2.5">
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                    </div>
                    {item.badge !== undefined && (
                      <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold ${
                        sidebarTab === item.id ? 'bg-blue-700 text-white' : 'bg-slate-200 text-slate-700'

                  <p className="font-medium text-blue-700 truncate">{user?.name}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">Role: {userRole}</p>
                </div>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 min-w-0 space-y-6">

                <p className="text-xs text-slate-500 mt-1">
                  Active Workspace &bull; Logged in as <span className="font-semibold text-slate-800">{user?.name} ({userRole})</span>
                </p>
              </div>

              <div className="flex items-center gap-2">
                {/* Admin Quick Audit button */}
                {userRole === "Admin" && (
                  <button
                    onClick={() => setSidebarTab("logs")}
                    className="py-2.5 px-3.5 bg-purple-50 hover:bg-purple-100 text-purple-800 rounded-xl text-xs font-semibold border border-purple-200 flex items-center gap-1.5"
                  >
                    <span>📜 System Audit Logs</span>
                    <span className="bg-purple-200 text-purple-900 px-1.5 rounded-full text-[10px] font-bold">{auditLogs.length}</span>
                  </button>
                )}

                {(userRole === "Admin" || userRole === "Doctor" || userRole === "EMT") && (
                  <button
                    onClick={onNavigateRecords}
                    className="py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-500/20 flex items-center justify-center gap-2"
                  >
                    <span>📂 Access Patient Records</span>
                    <span className="bg-blue-700 px-1.5 py-0.5 rounded text-[10px]">RFID / PIN</span>
                  </button>
                )}

            </div>

            {/* TAB CONTENT RENDERING WITH ROLE PROTECTION */}
            {sidebarTab === "overview" && <DashboardOverviewTab onNavigateRecords={onNavigateRecords} patientRecords={patientRecords} />}
            {sidebarTab === "patients" && (
              <DashboardPatientsTab 
                patientRecords={patientRecords} 
                user={user}
                onSelectPatient={onNavigateRecords}
                onDeletePatient={onDeletePatient}
                onEditPatient={onEditPatient}

            )}
            {sidebarTab === "rooms" && (
              <DashboardRoomsTab 
                rooms={rooms}
                setRooms={setRooms}
                userRole={userRole} 
                onOpenAddRoom={onOpenAddRoom}
              />

            {sidebarTab === "departments" && (
              <DashboardDepartmentsTab 
                departments={departments}
                setDepartments={setDepartments}
                staffUsers={staffUsers}
                userRole={userRole}

            {sidebarTab === "emergency" && <DashboardEmergencyTab onNavigateRecords={onNavigateRecords} userRole={userRole} />}
            {sidebarTab === "staff" && <DashboardStaffTab staffUsers={staffUsers} userRole={userRole} onOpenAddDoctor={onOpenAddDoctor} />}

              userRole === "Admin" ? (
                <DashboardAuditLogsTab auditLogs={auditLogs} />
              ) : (
                <div className="p-8 text-center glass-card rounded-2xl border border-rose-200 bg-rose-50/50">
                  <p className="text-sm font-bold text-rose-800">Access Denied</p>
                  <p className="text-xs text-rose-600 mt-1">Audit logs are restricted to Hospital Administration personnel only.</p>
                </div>
              )
            )}
            {sidebarTab === "settings" && userRole === "Admin" && <DashboardSettingsTab esp32Status={esp32Status} />}
          </div>
        </div>
      );
    }

    // ==========================================
    // 3A. OVERVIEW TAB
    // ==========================================

        { label: "Active Appointments", value: stats.activeAppointments, icon: "📅", note: "Scheduled outpatient visits" },
        { label: "Emergency Admissions", value: stats.emergencyAdmissions, icon: "🚨", note: "Trauma & ICU admissions" }
      ];

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
            {statCards.map((c, i) => (
              <div key={i} className="glass-card rounded-2xl p-5 border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-500">{c.label}</span>
                  <span className="text-xl">{c.icon}</span>
                </div>

                <p className="text-[11px] text-slate-400 mt-1">{c.note}</p>
              </div>
            ))}
          </div>

          <div className="glass-card rounded-2xl p-6 border border-blue-200 bg-gradient-to-r from-blue-50/60 to-white flex flex-col sm:flex-row items-center justify-between gap-4">

              <span className="text-[11px] font-bold uppercase tracking-wider text-blue-700 bg-blue-100 px-2 py-0.5 rounded">High Priority</span>
              <h2 className="text-lg font-bold text-slate-900">Patient Identification & EMR Verification</h2>
              <p className="text-xs text-slate-600 max-w-xl">
                Scan patient RFID wristband via RC522 or search using ID <span className="font-mono font-bold text-slate-800">PAT-2026-001</span> to view the full clinical record and surgical history.
              </p>
            </div>
            <button
              onClick={onNavigateRecords}

              Open EMR Scanner &rarr;
            </button>
          </div>
        </div>
      );
    }

    // ==========================================

            <div className="flex items-center gap-2">

                <span className="text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200 px-3 py-1.5 rounded-xl">

              {userRole === "Receptionist" && (

                  <th className="py-3 px-4">Full Name</th>
                  <th className="py-3 px-4">Age / Sex</th>
                  <th className="py-3 px-4">Blood Group</th>
                  <th className="py-3 px-4">Current Conditions</th>

                            Print Wristband

                      </td>

                  ))

              </tbody>
            </table>
          </div>
        </div>
      );

    // ==========================================
    // 3C. ACCESS & AUDIT LOGS TAB
    // ==========================================
    function DashboardAuditLogsTab({ auditLogs }) {
      return (
        <div className="glass-card rounded-2xl p-6 border border-slate-200 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                <span>Access & Security Audit Logs</span>
                <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-bold">
                  {auditLogs.length} Records
                </span>
              </h2>
              <p className="text-xs text-slate-500">
                Immutable compliance tracking: Emergency bypass, record alterations, deletions & scans
              </p>
            </div>
            <button
              onClick={() => window.print()}
              className="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 font-semibold self-start sm:self-auto"
            >
              Export Audit Trail
            </button>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-500 uppercase font-semibold text-[10px] tracking-wider border-y border-slate-200">
                <tr>
                  <th className="py-2.5 px-3">Timestamp</th>
                  <th className="py-2.5 px-3">User & Role</th>
                  <th className="py-2.5 px-3">Event Type</th>
                  <th className="py-2.5 px-3">Audit Details</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {auditLogs.map((log) => {
                  const isEmergency = log.action.includes("EMERGENCY");
                  const isDelete = log.action.includes("DELETED");
                  const isEdit = log.action.includes("ALTERED");

                  return (
                    <tr key={log.id} className={`hover:bg-slate-50/70 transition-colors ${
                      isEmergency ? 'bg-rose-50/50' : isDelete ? 'bg-amber-50/40' : ''
                    }`}>
                      <td className="py-3 px-3 font-mono text-slate-500 text-[11px] whitespace-nowrap">
                        {log.timestamp}
                      </td>
                      <td className="py-3 px-3">
                        <div className="font-bold text-slate-900">{log.user}</div>
                        <span className="text-[10px] bg-slate-100 px-1.5 py-0.2 rounded font-semibold text-slate-600">
                          {log.role}
                        </span>
                      </td>
                      <td className="py-3 px-3">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                          isEmergency 
                            ? 'bg-rose-100 text-rose-800 border border-rose-200' 
                            : isDelete 
                              ? 'bg-amber-100 text-amber-800 border border-amber-200'
                              : isEdit
                                ? 'bg-purple-100 text-purple-800 border border-purple-200'
                                : 'bg-blue-50 text-blue-700 border border-blue-200'
                        }`}>
                          {log.action}
                        </span>
                      </td>
                      <td className="py-3 px-3 text-slate-700 font-medium max-w-md">
                        {log.details}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3D. ROOMS & BEDS TAB (Admins & Receptionists can Add Rooms & Beds)
    // ==========================================
    function DashboardRoomsTab({ rooms, setRooms, userRole, onOpenAddRoom }) {
      const canManageRooms = userRole === "Admin" || userRole === "Receptionist";

      return (
        <div className="glass-card rounded-2xl p-6 border border-slate-200 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Rooms & Bed Allocation</h2>
              <p className="text-xs text-slate-500">Live ward occupancy, bed identifiers, and patient room assignments</p>
            </div>
            {canManageRooms && (
              <button 
                onClick={onOpenAddRoom}
                className="py-2 px-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm self-start sm:self-auto flex items-center gap-1.5"
              >
                <span>+ Add Room & Bed</span>
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {rooms.map((r, i) => (
              <div key={i} className={`p-4 rounded-xl border transition-all ${

              }`}>
                <div className="flex justify-between items-center mb-1">
                  <span className="font-bold text-xs text-slate-900">{r.room}</span>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                    r.status === 'Occupied' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                  }`}>
                    {r.status}
                  </span>
                </div>
                <p className="text-[11px] text-slate-500">{r.ward} &bull; <strong className="text-slate-700">{r.bed}</strong></p>
                <div className="mt-3 pt-2 border-t border-slate-200/60">
                  <span className="text-[10px] text-slate-400 block">Assigned Patient:</span>
                  <p className="text-xs font-semibold text-slate-800 truncate">{r.patient}</p>
                </div>
                {userRole === "Receptionist" && r.status === "Available" && (
                  <button

                    className="mt-2.5 w-full py-1 text-[11px] bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg transition-colors">
                    Assign Patient &rarr;
                  </button>
                )}

            ))}
          </div>
        </div>
      );

    function PatientEMRDashboard({ patientId, record, user, onEditPatient, onDeletePatient, onAddDocument, onRemoveDocument, onBackToLookup, onBackToDashboard }) {
      // Document Switcher State: 'DOC-POST' | 'DOC-PRE' | or custom uploaded documentId
      const [selectedDocId, setSelectedDocId] = useState("DOC-POST");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [isDragging, setIsDragging] = useState(false);

      const hasPre = !!record?.preRecord;
      const hasPost = !!record?.postRecord;
      const uploadedDocs = record?.uploadedDocuments || [];

      const pre = record?.preRecord;
      const post = record?.postRecord;

      // Find if selected document is an uploaded document
      const currentUploadedDoc = uploadedDocs.find(d => d.documentId === selectedDocId);

      // Handle file selection from input or drag-and-drop
      const handleFileProcess = (file) => {
        if (!file) return;
        const reader = new FileReader();
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const isImage = file.type.startsWith("image/");
        
        reader.onload = (e) => {
          const fileDataUrl = e.target.result;
          const newDocId = "DOC-UP-" + Date.now().toString().slice(-6);
          const newDoc = {
            documentId: newDocId,
            title: file.name.replace(/\.[^/.]+$/, ""),
            fileName: file.name,
            fileSize: (file.size / 1024).toFixed(1) + " KB",
            fileType: file.type || (isPdf ? "application/pdf" : "application/octet-stream"),
            uploadedAt: new Date().toLocaleString(),
            uploadedBy: `${user?.name || 'Authorized Staff'} (${user?.role || 'Staff'})`,
            category: isPdf ? "Clinical PDF Report" : (isImage ? "Diagnostic Image / Scan" : "Medical Document"),
            dataUrl: fileDataUrl,
            notes: "Document uploaded via secure EMR portal. Verified intact."
          };

          if (onAddDocument) {
            onAddDocument(record.id, newDoc);
          }
          setSelectedDocId(newDocId);
          setShowUploadModal(false);
        };

        reader.readAsDataURL(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileProcess(e.dataTransfer.files[0]);
        }
      };

      return (
        <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6 screen-fade">

                &larr; Patient Search

              <button 
                onClick={onBackToDashboard}

    function AdminEditPatientModal({ patient, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: patient.name,
        age: patient.age,
        bloodGroup: patient.bloodGroup,
        primaryCondition: patient.currentConditions?.[0] || "",
        previousDiagnoses: patient.history?.previousDiagnoses || ""
      });

        e.preventDefault();
        const updated = {
          ...patient,
          name: formData.name,
          age: formData.age,
          bloodGroup: formData.bloodGroup,
          currentConditions: [formData.primaryCondition, ...(patient.currentConditions?.slice(1) || [])],
          history: {
            ...patient.history,
            previousDiagnoses: formData.previousDiagnoses
          }
        };
        onSave(updated);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full border border-slate-200 shadow-2xl space-y-4">

                <option value="Acute emergency resuscitation / Unresponsive trauma intake">Acute emergency resuscitation / Unresponsive trauma intake</option>
                <option value="Hypovolemic shock / Immediate cross-match & surgical fixation">Hypovolemic shock / Immediate cross-match & surgical fixation</option>
                <option value="Cardiac arrest / Code Blue vital medical history retrieval">Cardiac arrest / Code Blue vital medical history retrieval</option>
                <option value="Severe altered mental status / Critical allergy check">Severe altered mental status / Critical allergy check</option>
              </select>
            </div>

            <div className="pt-2 flex flex-col sm:flex-row items-center justify-end gap-2 text-xs">
              <button
                type="button"
                onClick={onFallbackToPin}
                className="w-full sm:w-auto px-3.5 py-2 border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-50 font-semibold"
              >
                Enter Standard PIN Instead
              </button>
              <button
                type="button"
                onClick={() => onConfirm(justification)}
                className="w-full sm:w-auto px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5"
              >
                <span>Acknowledge Warning & Open EMR &rarr;</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. ADMIN & RECEPTIONIST: ADD ROOM & BED MODAL
    // ==========================================
    function AddRoomBedModal({ onClose, onAddRoom }) {
      const [roomData, setRoomData] = useState({
        room: "GEN-303",
        ward: "General Medicine",
        bed: "BED-A",
        status: "Available",
        patient: "—",
        id: "—"
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onAddRoom(roomData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full border border-slate-200 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <div>
                <h3 className="text-lg font-bold text-slate-900">Add New Hospital Room & Bed</h3>
                <p className="text-xs text-slate-500">Authorized: Administration & Reception Personnel</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Room Identifier</label>
                <input
                  type="text"
                  required
                  value={roomData.room}
                  onChange={(e) => setRoomData({ ...roomData, room: e.target.value })}
                  placeholder="e.g. ICU-04, GEN-303"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Ward Name</label>
                <select
                  value={roomData.ward}
                  onChange={(e) => setRoomData({ ...roomData, ward: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl bg-slate-50"
                >
                  <option value="General Medicine">General Medicine</option>
                  <option value="Intensive Care Unit">Intensive Care Unit</option>
                  <option value="Orthopedic Surgery">Orthopedic Surgery</option>
                  <option value="Cardiology Unit">Cardiology Unit</option>
                  <option value="Emergency Trauma Ward">Emergency Trauma Ward</option>
                  <option value="Pediatrics">Pediatrics</option>
                </select>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Bed Identifier</label>
                <input
                  type="text"
                  required
                  value={roomData.bed}
                  onChange={(e) => setRoomData({ ...roomData, bed: e.target.value })}
                  placeholder="e.g. BED-A, BED-1"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Initial Status</label>
                <select
                  value={roomData.status}
                  onChange={(e) => setRoomData({ ...roomData, status: e.target.value, patient: e.target.value === 'Available' ? '—' : roomData.patient })}
                  className="w-full px-3 py-2 border rounded-xl bg-slate-50"
                >
                  <option value="Available">Available (Unoccupied)</option>
                  <option value="Occupied">Occupied</option>
                </select>
              </div>

              {roomData.status === "Occupied" && (
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Initial Patient Name</label>
                  <input
                    type="text"
                    required
                    value={roomData.patient === "—" ? "" : roomData.patient}
                    onChange={(e) => setRoomData({ ...roomData, patient: e.target.value })}
                    placeholder="Enter patient name"
                    className="w-full px-3 py-2 border rounded-xl"
                  />
                </div>
              )}

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow"
                >
                  Add Room Allocation
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. ADMIN ONLY: ADD DOCTOR & ASSIGN DEPARTMENT MODAL
    // ==========================================
    function AddDoctorModal({ departments, onClose, onAddDoctor }) {
      const [doctorData, setDoctorData] = useState({
        username: "doctor_new",
        password: "123",
        role: "Doctor",
        name: "Dr. ",
        dept: departments[0]?.name || "Orthopedics & Trauma Surgery"
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onAddDoctor(doctorData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full border border-purple-200 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-purple-100 pb-3">
              <div>
                <h3 className="text-lg font-bold text-slate-900">Add Doctor & Assign Department</h3>
                <p className="text-xs text-purple-700 font-semibold">Strictly Admin Privileges Only</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Doctor Full Name & Title</label>
                <input
                  type="text"
                  required
                  value={doctorData.name}
                  onChange={(e) => setDoctorData({ ...doctorData, name: e.target.value })}
                  placeholder="e.g. Dr. Meredith Grey, MD"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Assign Clinical Department</label>
                <select
                  value={doctorData.dept}
                  onChange={(e) => setDoctorData({ ...doctorData, dept: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl bg-purple-50/50 text-slate-800 font-medium"
                >
                  {departments.map((d, i) => (
                    <option key={i} value={d.name}>{d.name} (Head: {d.head})</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Login Username</label>
                  <input
                    type="text"
                    required
                    value={doctorData.username}
                    onChange={(e) => setDoctorData({ ...doctorData, username: e.target.value.toLowerCase().trim() })}
                    placeholder="doctor_name"
                    className="w-full px-3 py-2 border rounded-xl font-mono"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Initial Password</label>
                  <input
                    type="password"
                    required
                    value={doctorData.password}
                    onChange={(e) => setDoctorData({ ...doctorData, password: e.target.value })}
                    className="w-full px-3 py-2 border rounded-xl font-mono"
                  />
                </div>
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-semibold shadow"
                >
                  Assign Doctor & Save
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
